name: 网易云音乐去广告
description: '过滤网易云音乐广告，并允许自定义界面。'
author: 'RuCu6, Keywos'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/NeteaseCloudMusic.png'
rules:
  - 'DOMAIN,iadmat.nosdn.127.net,REJECT'
  - 'DOMAIN,iadmatapk.nosdn.127.net,REJECT'
  - 'DOMAIN,iadmusicmat.music.126.net,REJECT'
  - 'DOMAIN,iadmusicmatvideo.music.126.net,REJECT'
  - 'DOMAIN,ipv4.music.163.com,REJECT'
  - 'DOMAIN,ipv6.music.163.com,REJECT'
mitm:
  hostnames:
    - 'interface*.music.163.com'
script:
  - name: '评论区、热推、有话想说、分享一下、歌曲下的祝福等小提示'
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:batch|v2\/resource\/comment\/floor\/get)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
  - name: '推荐、home、主页'
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:homepage\/block\/page|link\/page\/rcmd\/(?:block\/resource\/multi\/refresh|resource\/show))'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
  - name: 底部选项卡
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/home\/framework\/tab'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
  - name: 发现页
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/page\/discovery\/resource\/show'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
  - name: 我的页面
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/link\/position\/show\/resource'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
  - name: 显示未关注你的人
    type: http-response
    pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/user\/follow\/users\/mixed\/get'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/NeteaseCloudMusic_remove_ads.js'
map_local:
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/e?api\/(ocpc\/)?ad\/'
    data: ''
    status_code: 200
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:delivery\/(batch-)?deliver|moment\/tab\/info\/|side-bar\/mini-program\/music-service\/account|yunbei\/account\/entrance\/)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:community\/friends\/fans-group\/artist\/group\/|mine\/applet\/redpoint|music\/songshare\/text\/recommend\/|resniche\/position\/play\/new\/|resniche\/tspopup\/show|resource\/comments?\/musiciansaid\/|user\/sub\/artist)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/eapi\/(?:ios\/version|mlivestream\/entrance\/playpage\/|link\/position\/show\/strategy|link\/scene\/show\/resource|v1\/content\/exposure\/comment\/banner\/)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163.com\/w?e?api\/search\/default'
    data: ''
    status_code: 200
  - pattern: '(?i)^https?:\/\/interface\d?\.music\.163\.com\/w?eapi\/(?:activity\/bonus\/playpage\/time\/query|resource-exposure\/|search\/(?:chart\/|rcmd\/keyword\/|specialkeyword\/))'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/interface\d\.music\.163\.com\/eapi\/my\/podcast\/tab\/recommend'
    data: '{}'
    status_code: 200
