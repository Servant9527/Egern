name: iRingo苹果地图
author: VirgilClyne
rules:
  - 'DOMAIN-SUFFIX,is.autonavi.com,DIRECT'
  - 'DOMAIN,gspe11-2-cn-ssl.ls.apple.com,DIRECT'
  - 'DOMAIN,gspe12-cn-ssl.ls.apple.com,DIRECT'
  - 'DOMAIN,gspe19-cn-ssl.ls.apple.com,DIRECT'
  - 'DOMAIN,gspe19-2-cn-ssl.ls.apple.com,DIRECT'
  - 'DOMAIN,gspe79-cn-ssl.ls.apple.com,DIRECT'
mitm:
  hostnames:
    - configuration.ls.apple.com
    - gspe35-ssl.ls.apple.com
script:
  - name: '🗺️ Maps.config.defaults.request'
    type: http-request
    pattern: '^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults'
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/request.bundle.js
  - name: '🗺️ Maps.config.defaults.response'
    type: http-response
    pattern: '^https?:\/\/configuration\.ls\.apple\.com\/config\/defaults'
    requires_body: true
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/response.bundle.js
  - name: '🗺️ Maps.config.announcements.request'
    type: http-request
    pattern: '^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/config\/announcements'
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/request.bundle.js
  - name: '🗺️ Maps.config.announcements.response'
    type: http-response
    pattern: '^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/config\/announcements'
    requires_body: true
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/response.bundle.js
  - name: '🗺️ Maps.geo_manifest.dynamic.config.request'
    type: http-request
    pattern: '^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/geo_manifest\/dynamic\/config'
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/request.bundle.js
  - name: '🗺️ Maps.geo_manifest.dynamic.config.response'
    type: http-response
    pattern: '^https?:\/\/gspe35-ssl\.ls\.apple\.(com|cn)\/geo_manifest\/dynamic\/config'
    requires_body: true
    script_url: https://gh-proxy.com/https://github.com/NSRingo/MapKit/releases/download/v4.6.1/response.bundle.js
