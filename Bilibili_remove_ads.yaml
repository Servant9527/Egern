name: 哔哩哔哩去广告
description: |
  过滤哔哩哔哩广告、移除青少年模式弹窗和交互式弹幕、移除无用功能和链接跟踪参数，增加空降助手以便跳过视频中插入的广告。此插件仅建议iOS 15以上设备使用，且必须启用MitM-over-HTTP/2功能。
  
  空降助手是第三方提供的功能，依赖于Android版空降助手的服务器数据运作，可能会存在不准确或者失效的问题，此功能与哔哩哔哩官方无关。
author: kokoryh
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/Bilibili.png'
rules:
  - 'DOMAIN,bsbsb.top,兜底策略'
  - 'DOMAIN,api.biliapi.com,REJECT'
  - 'DOMAIN,app.biliapi.com,REJECT'
  - 'DOMAIN,api.biliapi.net,REJECT'
  - 'DOMAIN,app.biliapi.net,REJECT'
  - 'AND,((DOMAIN-SUFFIX,chat.bilibili.com),(OR,((DOMAIN-KEYWORD,stun),(DOMAIN-KEYWORD,tracker),(DOMAIN-KEYWORD,p2p)))),REJECT'
rewrite:
  - pattern: '(?i)^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(interface\.v1\.(Teenagers\/ModeStatus|Search\/DefaultWords)|view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(PlayPause|ViewEndPage))$'
    target: 'header-add "grpc-status" "0"'
    type: header-rewrite
mitm:
  hostnames:
    - grpc.biliapi.net
    - app.bilibili.com
    - api.bilibili.com
    - api.live.bilibili.com
    - line3-h5-mobile-api.biligame.com
script:
  - name: 空降助手
    type: http-request
    pattern: '(?i)^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.community\.service\.dm\.v1\.DM\/DmSegMobile$'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Bilibili_proto_request_kokoryh.js'
  - name: 请求处理
    type: http-request
    pattern: '(?i)^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Bilibili_proto_request_kokoryh.js'
  - name: ProtoBuf处理
    type: http-response
    pattern: '(?i)^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(app\.(show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(unite)?\.v1\.View\/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Bilibili_proto_response_kokoryh.js'
  - name: 移除直播间广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.live\.bilibili\.com\/xlive\/(?:app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(?:Room|User))\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/kokoryh/Script@master/js/bilibili_json.js'
map_local:
  - pattern: '(?i)^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list\?'
    data: '{\"code\":0,\"message\":\"OK\",\"ttl\":1,\"data\":{\"max_time\":0,\"min_interval\":31536000,\"pull_interval\":31536000,\"keep_ids\":[],\"show\":[],\"list\":[{}],\"splash_request_id\":\"\"}}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?'
    data: '{\"code\":0,\"data\":{\"closeType\":\"close_win\",\"container\":[],\"showTime\":\"\"},\"message\":\"success\"}'
    status_code: 200
  - pattern: '(?i)^https:\/\/ap[ip]\.bilibili\.com\/x\/(resource\/(top\/activity|patch\/tab(\/v2)?)|v2\/search\/square|vip\/ads\/materials)\?'
    data: '{\"code\":-404,\"message\":\"-404\",\"ttl\":1,\"data\":null}'
    status_code: 200
  - pattern: '(?i)^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus$'
    data: AAAAABMKEQgCEgl0ZWVuYWdlcnMgAioA
    data_type: base64
    status_code: 200
  - pattern: '(?i)^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$'
    data: AAAAACEaHeaQnOe0ouinhumikeOAgeeVquWJp+aIlnVw5Li7KAE=
    data_type: base64
    status_code: 200
  - pattern: '(?i)^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(PlayPause|ViewEndPage))$'
    data: AAAAAAA=
    data_type: base64
    status_code: 200
