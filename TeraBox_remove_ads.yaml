name: TeraBox去广告
description: '移除开屏广告、应用内悬浮窗、弹窗广告及横幅广告。'
author: '可莉🅥'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/TeraBox.png'
rules:
  - 'DOMAIN,ymg-api.terabox.com,REJECT'
mitm:
  hostnames:
    - www.terabox.com
map_local:
  - pattern: '(?i)^https:\/\/www\.terabox\.com\/adx\/'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/www\.terabox\.com\/api\/ad\/'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/www\.terabox\.com\/api\/page\/tips\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/www\.terabox\.com\/rest\/1\.0\/task\/common\/inttips\?'
    data: '{}'
    status_code: 200
