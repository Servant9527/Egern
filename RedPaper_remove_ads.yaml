name: 小红书去广告
description: '过滤信息流推广，移除图片及视频水印，如有异常，请先清除缓存再尝试。'
author: 'RuCu6, fmz200'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/RedPaper.png'
rules:
  - 'AND,((PROTOCOL,QUIC),(DOMAIN-SUFFIX,xiaohongshu.com)),REJECT'
mitm:
  hostnames:
    - ci.xiaohongshu.com
    - edith.xiaohongshu.com
    - rec.xiaohongshu.com
    - so.xiaohongshu.com
    - www.xiaohongshu.com
script:
  - name: 移除图片和实况照片水印
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/note\/(?:imagefeed|live_photo\/save)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: '移除整体配置 ui'
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/system\/service\/ui\/config\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: '移除开屏广告 config'
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/system_service\/config\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: '移除开屏广告 splash_config'
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v2\/system_service\/splash_config'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: '移除详情页小部件、关注页感兴趣的人'
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v2\/(?:note\/widgets|user\/followings\/followfeed)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除信息流广告
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/followfeed\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除详情页感兴趣的人
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v5\/recommend\/user\/follow_recommend\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除评论区实况照片水印
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除图片和视频水印
    type: http-response
    pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/note\/feed|v3\/note\/videofeed)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除信息流广告
    type: http-response
    pattern: '(?i)^https:\/\/(?:edith|rec)\.xiaohongshu\.com\/api\/sns\/v6\/homefeed\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除搜索页广告
    type: http-response
    pattern: '(?i)^https:\/\/(?:edith|so)\.xiaohongshu\.com\/api\/sns\/v10\/search\/notes\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
  - name: 移除视频水印
    type: http-response
    pattern: '(?i)^https:\/\/(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/RedPaper_remove_ads.js'
map_local:
  - pattern: '(?i)^https:\/\/ci\.xiaohongshu\.com\/system_config\/watermark'
    data: ''
    data_type: tiny-gif
    status_code: 200
  - pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/www\.xiaohongshu\.com\/api\/marketing\/box\/trigger\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/guide\/user_banner|v3\/note\/guide)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/www\.xiaohongshu\.com\/api\/sns\/(?:v1\/ads\/resource|v2\/hey\/\w+\/hey_gallery)'
    data: '{}'
    status_code: 200
