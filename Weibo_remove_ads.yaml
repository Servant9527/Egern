  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/video\/redpacket\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/(?:search\/finder_nav_polling|sug\/list\/finderchange|was\/finder\/searchbarchange)\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/video\/tiny_video_info_show\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/bootrealtime\.uve\.weibo\.com\/v[23]\/ad\/realtime'
    data: '{}'
