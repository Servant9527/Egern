  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/huati\/(?:discovery_home_bottom_getdotinfo|mobile_discovery_searchchange)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/wbox\/\w+\/(?:home_bottom_modal|interest_category)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/search\/(?:container_discover|finder_nav_polling)\?'
    data: '{}'
