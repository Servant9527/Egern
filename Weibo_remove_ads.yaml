name: 微博去广告
description: 过滤微博广告及去除各部分推广模块
author: 'RuCu6, zmqcherish'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/Weibo.png'
rules:
  - 'DOMAIN-SUFFIX,uve.weibo.com,DIRECT'
  - 'DOMAIN,huodong.weibo.cn,REJECT'
  - 'DOMAIN-SUFFIX,biz.weibo.com,REJECT'
mitm:
  hostnames:
    - '*.weibo.cn'
    - '*.weibo.com'
    - weibo.com
script:
  - name: 移除首页推广
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/(?:checkin\/show|client\/publisher_list|push\/active)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除首页顶部标签
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/groups\/allgroups\/v2\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除信息流广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/(?:cardlist|page)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除评论区广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/comments\/build_comments\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除个人微博详情页广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/(?:container\/asyn|flowlist|flowpage)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: '移除关注、取消关注弹窗'
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/friendships\/(?:create|destroy)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除个人主页广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/profile\/(?:container_timeline|dealatt|me|statuses\/tab|userinfo)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除超话搜索页广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/shproxy\/chaohua\/discovery\/searchactive\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除评论区广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:comments_expand_child|container_detail_comment)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除信息流广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:container_detail\?|container_timeline(?:_hot|_topic|_topicpage|_unread)?|repost_timeline|unread_hot_timeline)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除微博详情页广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:extend|show)\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除视频流广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/video\/(?:full_screen_stream|tiny_stream_mid_detail|tiny_stream_video_list)\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除超话顶部标签
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/huati\/discovery_home_bottom_channels\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除消息页列表广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/direct_messages\/user_list\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除消息页提醒
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/messageflow\/notice\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除热门微博信息流广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/search\/(?:container_timeline|finder)\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: 移除发现页搜索结果广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/searchall\?'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: '移除开屏广告 preload'
    type: http-response
    pattern: '(?i)^https:\/\/bootpreload\.uve\.weibo\.com\/v[12]\/ad\/preload'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: '移除开屏广告 sdkad'
    type: http-response
    pattern: '(?i)^https:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkad\.php'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
  - name: '移除开屏广告 wbapplua'
    type: http-response
    pattern: '(?i)^https:\/\/wbapp\.uve\.weibo\.com\/(?:preload\/get_ad|wbapplua\/wbpullad\.lua)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/Weibo_remove_ads.js'
map_local:
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/(?:ug\/checkin\/list|push\/daily|push\/info)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/live\/media_homelist\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/comments\/bullet_screens\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/photo\/info\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/statuses\/(?:container_positive|push_info)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/vote\/get_vote_detail\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/api\.weibo\.cn\/2\/!\/chaohua\/discovery\/home_bottom\/switch\?'
    data: '{}'
