name: 汽车之家去广告
description: '移除开屏广告、各类广告横幅、各类信息流广告、各类弹窗推广、各类浮窗、我的页面广告。'
author: '可莉🅥'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/AutoHome.png'
mitm:
  hostnames:
    - a.athm.cn
    - adproxy.autohome.com.cn
    - apiautoappusc.che168.com
    - autoapi.autohome.com.cn
    - cars.app.autohome.com.cn
    - clientlive.api.autohome.com.cn
    - club.app.autohome.com.cn
    - dealer.m.autohome.com.cn
    - maam.pingan.com.cn
    - mobile.app.autohome.com.cn
    - news.app.autohome.com.cn
    - pcmx.autohome.com.cn
script:
  - name: 精简我的页面
    type: http-response
    pattern: '(?i)^https:\/\/news\.app\.autohome\.com\.cn\/news_v\d+(?:\.\d+){2}\/news\/homenavigation'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
  - name: 精简我的页面
    type: http-response
    pattern: '(?i)^https:\/\/(a\.athm\.cn\/)?mobile\.app\.autohome\.com\.cn\/platform\/carserver\/((usercenter\/getservicecards)|(carcard\/allcard)|(carcard\/mycardv\d+)|(carcard\/cards))'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
  - name: 社区广场去广告
    type: http-response
    pattern: '(?i)^https:\/\/(a\.athm\.cn\/)?club\.app\.autohome\.com\.cn\/club_v\d+(?:\.\d+){2}\/club\/index\/businessv\d+'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
  - name: 移除直播浮窗
    type: http-response
    pattern: '(?i)^https:\/\/(a\.athm\.cn\/)?cars\.app\.autohome\.com\.cn\/carstreaming\/selectcarportal\/reclist'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
  - name: 移除报价页面直播内容
    type: http-response
    pattern: '(?i)^https:\/\/(a\.athm\.cn\/)?cars\.app\.autohome\.com\.cn\/carstreaming\/selectcarportal\/seriestopwithtagscard'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
  - name: 移除二手车竖版轮播图
    type: http-response
    pattern: '(?i)^https:\/\/(a\.athm\.cn\/)?apiautoappusc\.che168\.com\/apic\/v\d+\/gethomepagefeed'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/AutoHome_remove_ads.js'
