name: 京东去广告
description: '移除京东开屏广告，精简我的页面产品推广。'
author: 'RuCu6, Maasea'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/JD.png'
rules:
  - 'URL-REGEX,"^http:\/\/\w{32}\.jddebug\.com\/diagnose\?",REJECT'
mitm:
  hostnames:
    - api.m.jd.com
script:
  - name: 移除京东广告
    type: http-response
    pattern: '(?i)^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(deliverLayer|getTabHomeInfo|myOrderInfo|orderTrackBusiness|personinfoBusiness|start|welcomeHome)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/JD_remove_ads.js'
map_local:
  - pattern: '(?i)^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(searchBoxWord|stationPullService|uniformRecommend[06])'
    data: '{}'
    status_code: 200
