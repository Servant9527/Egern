name: 百度网页去广告
description: 移除百度搜索移动端网页的首页广告信息流
author: Keywos
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/Baidu.png'
mitm:
  hostnames:
    - m.baidu.com
    - www.baidu.com
script:
  - name: 移除百度搜索首页信息流广告
    type: http-response
    pattern: '"(?i)^https?:\/\/(www|m)\.baidu\.com\/?($|\?from=\w{8,9})"'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/BaiduSearchHomePage_remove_ads.js'
