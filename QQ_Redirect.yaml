name: QQ链接解锁
description: '解除QQ内访问非白名单之外的地址提示停止访问该页面的限制，并移除跟踪参数，使用前需要清除QQ的缓存数据。'
author: '可莉🅥'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/QQ.png'
rewrite:
  - pattern: '(?i)^https:\/\/c\.pc\.qq\.com\/middlem\.html\?pfurl=(http.*)&pfuin=.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/c\.pc\.qq\.com\/middlect\.html\?pfuin=.*&pfurl=(http.*)&gjsublevel=.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/c\.pc\.qq\.com\/middlect\.html\?iscontinue=.*pfurl=(http.*)&pfuin=.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/pingtas\.qq\.com\/webview\/pingd\?dm=c\.pc\.qq\.com&pvi=\d+&si=s\d+&url=\/middlem\.html\?pfurl%3d(http.*)%26pfuin%3d.*%26pfuin%3d.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/cgi\.connect\.qq\.com\/qqconnectopen\/get_urlinfoForQQV2\?url=(http.*)'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/c\.pc\.qq\.com\/index\.html\?pfurl=(http.*)&pfuin=.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/c\.pc\.qq\.com\/ios\.html\?url=(http.*)&level=.*'
    target: '$1'
    type: url-rewrite
  - pattern: '(?i)^https:\/\/pingtas\.qq\.com\/webview\/pingd\?dm=c\.pc\.qq\.com&pvi=\d+&si=s\d+&url=\/ios\.html\?url%3d(http.*)%26level.*%26level.*'
    target: '$1'
    type: url-rewrite
mitm:
  hostnames:
    - pingtas.qq.com
    - c.pc.qq.com
    - cgi.connect.qq.com
