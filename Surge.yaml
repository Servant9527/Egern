name: Sub-Store
description: '支持 Surge 正式版的参数设置功能. 测落地功能 ability: http-client-policy, 同步配置的定时 cronexp: 55 23 * * *'
author: Peng-YM
mitm:
  hostnames:
    - sub.store
script:
  - name: 'Sub-Store Core'
    type: http-request
    pattern: '^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info)))'
    requires_body: true
    script_url: https://gh-proxy.com/https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-1.min.js
  - name: 'Sub-Store Simple'
    type: http-request
    pattern: '^https?:\/\/sub\.store'
    requires_body: true
    script_url: https://gh-proxy.com/https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-0.min.js
  - name: 'Sub-Store Sync'
    type: cron
    cronexp: '55 23 * * *'
    script_url: https://gh-proxy.com/https://github.com/sub-store-org/Sub-Store/releases/latest/download/cron-sync-artifacts.min.js
