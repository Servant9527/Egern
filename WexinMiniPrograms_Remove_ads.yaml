script:
  - name: 企迈点单系统去广告
    type: http-response
    pattern: '(?i)^https:\/\/webapi\.qmai\.cn\/web\/catering\/design\/homePage-Config'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/kff.js'
  - name: EMS中国邮政物流速递去广告
    type: http-response
    pattern: '(?i)^https:\/\/ump\.ems\.com\.cn\/new-generation-extend\/redis\/pageInfoByChannel'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/ems.js'
  - name: 小兔充充去广告
    type: http-response
    pattern: '(?i)^https:\/\/mapi\.xiaotucc\.com\/(mall\/main|main_page\/index\/getActivity)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/xiaotucc.js'
  - name: 全家微会员去广告
    type: http-response
    pattern: '(?i)^https:\/\/minifm\.maxxipoint\.com\/banner\/list'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/FamilyMart.js'
  - name: 罗森点点去广告
    type: http-response
    pattern: '(?i)^https:\/\/lawsonapi\.yorentown\.com\/area\/sh-lawson\/app\/v1\/home'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/lawson.js'
  - name: 茶颜悦色去广告
    type: http-response
    pattern: '(?i)^https:\/\/miniapp\.sexytea2013\.com\/cms\/slot\/queryByCodes\?codes=INDEX_TOP_BANNER'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/chayanyuese_remove_ads.js'
  - name: COCO点单去广告
    type: http-response
    pattern: '(?i)^https:\/\/coco-com\.e\.verystar\.net\/v1\/home\/info'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/coco.js'
  - name: 滴滴青桔去广告
    type: http-response
    pattern: '(?i)^https:\/\/htwkop\.xiaojukeji\.com\/gateway\?api=hm\.fa\.homeConfig'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/qingju.js'
  - name: 一点点+去广告
    type: http-response
    pattern: '(?i)^https:\/\/cappapi\.alittle-tea\.com\/open\?method=catering\.set\.ad'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/alittle-tea.js'
  - name: 'M Stand去广告'
    type: http-response
    pattern: '(?i)^https:\/\/api\.prod\.dj\.mstand\.cn\/scrm\/mini\/app\/index\/info'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/M_Stand.js'
  - name: T3出行去广告
    type: http-response
    pattern: '(?i)^https:\/\/passenger\.t3go\.cn\/(solution\-|common\-)?(passenger\-)?(activity\-|app\-)?api\/notoken\/(trip\/)?api\/(home\/|common\/)?(v[1-3]\/)?(ad\/getNegativescreen|solution\/passenger\/open\/getHomeMenu|leftmenu|getHomeInfoGlobal)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/T3.js'
  - name: 古茗去广告
    type: http-response
    pattern: '(?i)^https:\/\/newton\.gumingnc\.com\/newton-buyer\/newton\/buyer\/(ump|touch|external\/front)'
    requires_body: true
    script_url: 'https://cdn.jsdelivr.net/gh/mihoyo-typ/KeleeOne@Loon/Script/ming.js'
