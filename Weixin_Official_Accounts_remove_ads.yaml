name: 微信公众号去广告
description: 过滤微信公众号广告
author: RuCu6
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/Weixin.png'
rules:
  - 'DOMAIN-SUFFIX,wxs.qq.com,REJECT'
mitm:
  hostnames:
    - mp.weixin.qq.com
map_local:
  - pattern: '(?i)^https:\/\/mp\.weixin\.qq\.com\/mp\/(cps_product_info|getappmsgad|jsmonitor|masonryfeed|relatedarticle)\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/mp\.weixin\.qq\.com\/mp\/relatedsearchword'
    data: '{}'
    status_code: 200
