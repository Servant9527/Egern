name: 爱奇艺去广告
description: '移除开屏广告、焦点图广告、瀑布流广告、搜索页面广告、移除青少年弹窗，精简底栏和我的页面。'
author: '可莉🅥'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/iQiYi_Video.png'
rules:
  - 'IP-CIDR,103.44.59.54/32,REJECT,no-resolve'
  - 'IP-CIDR,111.63.147.158/32,REJECT,no-resolve'
  - 'IP-CIDR,116.211.198.237/32,REJECT,no-resolve'
  - 'DOMAIN-SUFFIX,cupid.iqiyi.com,DIRECT'
  - 'DOMAIN,api.iqiyi.com,REJECT'
  - 'DOMAIN,access.if.iqiyi.com,REJECT'
mitm:
  hostnames:
    - -i.vip.iqiyi.com
    - '*.iqiyi.com'
map_local:
  - pattern: '(?i)^https?:\/\/iface2\.iqiyi\.com\/control\/3\.0\/init_proxy\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/act\.vip\.iqiyi\.com\/interact\/api\/v2\/show\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/iface2\.iqiyi\.com\/ivos\/interact\/video\/data\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/iface2\.iqiyi\.com\/video\/3\.0\/v_interface_proxy\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https?:\/\/iface2\.iqiyi\.com\/views_pop\/3\.0\/pop_control\?'
    data: '{}'
    status_code: 200
