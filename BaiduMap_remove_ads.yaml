name: 百度地图去广告
description: '移除开屏广告、出行页面推广、周边页面推广、打车页面推广，精简我的页面。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。'
author: '可莉🅥'
icon: 'https://cdn.jsdelivr.net/gh/luestr/IconResource@main/App_icon/120px/BaiduMap.png'
mitm:
  hostnames:
    - afd.baidu.com
    - newclient.map.baidu.com
    - yongche.baidu.com
    - ecom.map.baidu.com
map_local:
  - pattern: '(?i)^https:\/\/afd\.baidu\.com\/afd\/entry\?action=(update|query)'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/yongche\.baidu\.com\/gomarketing\/api\/popup\/getentrancecordovaurl$'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/cobuild\/pull\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/operationgirdle$'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/yongche\.baidu\.com\/goorder\/passenger\/baseinfo$'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/ecom\.map\.baidu\.com\/ad-ops\/afd\/popup\?'
    data: '{}'
    status_code: 200
  - pattern: '(?i)^https:\/\/maphotel\.baidu\.com\/hotel\/goextranet\/activity\/detail\?'
    data: '{}'
    status_code: 200
